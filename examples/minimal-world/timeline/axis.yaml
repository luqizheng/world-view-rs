# 时间轴定义（示例）· schema v2
# 历法只负责显示换算：无仙 300 年 1 月 1 日 ↔ 第 107641 天。
calendar:
  prefix: 无仙
  start_year: 1
  days_per_year: 360
  days_per_month: 30
timeline_range:
  from: 1
  to: 180001
anchors:
  - id: anchor_founding
    name: 青云城建城
    # 无仙 300 年 1 月 1 日 = (300-1)*360 + (1-1)*30 + (1-1) + 1 = 107641
    day: 107641
