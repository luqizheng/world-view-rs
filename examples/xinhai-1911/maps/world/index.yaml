# 世界地图（辛亥示例）
# P4：父图只存子图 Id（children），不复制子图内容。
# 标题明确时代范围（README §11 + 目录名 `xinhai-1911`）：1911 年清末中华大地，
# 不是「通史中国」也不是「现代中国」。
id: map_world
name: 1911 年中华大地
level: world
children:
  - map_city_wuchang
  - map_city_chengdu
extent:
  width: 4096.0
  height: 4096.0
# 地形栅格（AGENTS §5 唯一二进制例外）：gen_xinhai_terrain 示例生成，512² 网格。
raster:
  path: maps/map_world/terrain.bin
  encoding: i16
  width: 512
  height: 512
  chunk: 256
  format_version: 1
  checksum: f84c6933
# 真实地理底图引用（ADR-0007）：只声明主题/bbox/路径，**不**把 Overture 几何写进本 yaml。
# bbox 覆盖 1911 年清帝国内地 22 省核心区域（黑龙江至海南），不含蒙藏新。
# （注意：本工程为示例，地形栅格仍是手写 Perlin 噪声，与 Overture 几何不一致——
#   真实地理底图需另行 `wv raster-slice` 从父图栅格切出，参见 README §12-24。）
geographic_source:
  theme: places
  bbox:
    west: 100.0
    south: 22.0
    east: 122.0
    north: 42.0
  data_path: maps/map_world/data/places.geojson
  release: 2026-09-23.0
layers:
  - id: layer_terrain
    name: 地形
    kind: terrain
    visible: true
    locked: false
    opacity: 1.0
    z: 0
    source: terrain.bin
# 城市标记：锚点 = distances/places.yaml 中同名 Place 的 (x,y) ÷ extent(4096)，归一化 [0,1]²。
# 武汉 / 成都带 drill_into（双击钻入城市子图）；北京为帝都用四角星。
icons:
  - id: icon_beijing
    anchor: [0.293, 0.269]
    shape: star
    size: 16.0
    color: "#c8a24a"
  - id: icon_chengdu
    anchor: [0.220, 0.464]
    drill_into: map_city_chengdu
  - id: icon_chongqing
    anchor: [0.305, 0.476]
    shape: circle
    size: 12.0
  - id: icon_yichang
    anchor: [0.366, 0.452]
    shape: circle
    size: 12.0
  - id: icon_wuhan
    anchor: [0.403, 0.415]
    drill_into: map_city_wuchang
  - id: icon_changsha
    anchor: [0.415, 0.464]
    shape: circle
    size: 12.0
  - id: icon_xian
    anchor: [0.305, 0.342]
    shape: circle
    size: 12.0
  - id: icon_nanjing
    anchor: [0.464, 0.366]
    shape: circle
    size: 12.0
  - id: icon_shanghai
    anchor: [0.501, 0.391]
    shape: circle
    size: 12.0
  - id: icon_guangzhou
    anchor: [0.427, 0.562]
    shape: circle
    size: 12.0
