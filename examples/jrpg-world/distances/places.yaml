# 地点节点（示例）
#
# `kind` 是 POI 符号类别（ADR-0064）：写 `settlement` 才会在专业制图里
# 用「聚落」色；不写则回退默认红点（`other`）。山脉/山峰请写 `kind: peak`
# 且**不要**写 `biome`（带 biome 的地点不生成点标，归覆盖物层）。
- id: city_qingyun
  name: 青云城
  map: world_main
  kind: settlement
  facilities: []
- id: village_heishui
  name: 黑水村
  map: world_main
  kind: settlement
  facilities: []
- id: pass_luoxia
  name: 落霞关
  map: world_main
  facilities: []

