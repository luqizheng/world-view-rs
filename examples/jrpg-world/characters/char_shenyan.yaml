# 角色：沈砚（示例）· schema v2
# 演示 §4.1：不存 current_place，只存区间化的 state_spans。
# 时间字段是天数计数器；half-open [from, to)。
id: char_shenyan
name: 沈砚
traits:
  - 沉稳
  - 多疑
attributes:
  门派: 青云宗
born_at: 100441           # 无仙 280 年 1 月 15 日
# died_at 可选（天数计数器）。沈砚仍在世，故**刻意留空**——留白是创作手段，
# 不是数据缺失。人物视图在有卒年时显示「沈砚(生卒年)」，无卒年时只显示名字。
# 例：康熙帝(1654-1722) —— 但「1654」是 Calendar 派生的年份，不是存储值。
state_spans:
  - from: 107641          # 无仙 300 年 1 月 1 日
    to: 109441            # 无仙 305 年 1 月 1 日（不含）
    place: city_qingyun
    title: 外门弟子
    power: 10.0
  - from: 109441          # 无仙 305 年 1 月 1 日
    place: village_heishui
    title: 巡山执事
    power: 35.0
