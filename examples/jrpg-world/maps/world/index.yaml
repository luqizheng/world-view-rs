# 世界地图索引（示例）
# 演示 §5.2 时间区间存储：疆界不是「当前值」，而是带区间的状态片段。

id: world_main
name: 演示大陆
level: world
# 与 maps/world_main/index.yaml 是**同 id 双份**（历史遗留）：加载器扁平扫描
# `maps/*/index.yaml` 后按 id 查找，目录名排序 world < world_main，先命中
# **本文件**——比例尺换算读的节点在这里，故本文件也须声明同一尺度。
# 4 世界单位 = 1 km（每格恰 1 km，全图约 1024 km），与 world_main 份保持一致。
unit_per_km: 4
children:
  - map_1
# 城市子图（map_1）的钻入入口：归一化锚点落在大陆中部的平原上，
# 双击即钻入城市图（场景分区编辑 M1 的演示入口）。
icons:
  - id: icon_city_map_1
    anchor:
      - 0.30
      - 0.55
    shape: diamond
    size: 14.0
    drill_into: map_1
# 2026-10-12 裁定（甲）：地图**不携带物理跨度字段**——
# 相遇判定改为「Waypoint (place, day) 严格相等」，无需公里换算。
extent:
  width: 4096.0
  height: 4096.0
raster:
  path: maps/world/terrain.bin
  encoding: i16
  width: 1024
  height: 1024
  chunk: 256
  format_version: 2
  checksum: 4fd4c70e
layers:
  - id: layer_terrain
    name: 地形
    kind: terrain
    visible: true
    locked: false
    opacity: 1.0
    z: 0
    source: terrain.bin
  - id: layer_borders
    name: 疆界
    kind: border
    visible: true
    locked: false
    opacity: 0.8
    z: 10
    source: borders.yaml
  - id: layer_roads
    name: 道路
    kind: road
    visible: true
    locked: false
    opacity: 0.9
    z: 20
    source: roads.yaml
