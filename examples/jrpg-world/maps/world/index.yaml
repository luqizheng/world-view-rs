# 世界地图索引（示例）
# 演示 §5.2 时间区间存储：疆界不是「当前值」，而是带区间的状态片段。

id: world_main
name: 演示大陆
level: world
children: []
# 2026-10-12 裁定（甲）：地图**不携带物理跨度字段**——
# 相遇判定改为「Waypoint (place, day) 严格相等」，无需公里换算。
extent:
  width: 4096.0
  height: 4096.0
# 比例尺（作者自报，ADR-0052 追记五）：1 km = 16 wu，即 1 格 = 0.25 km、
# 图幅 256 km。渲染层的细节门控（森林贴图等）按它把视野跨度折成公里。
unit_per_km: 16.0
raster:
  path: maps/world/terrain.bin
  encoding: i16
  width: 1024
  height: 1024
  chunk: 256
  format_version: 2
  checksum: 4fd4c70e
layers:
  - id: layer_terrain
    name: 地形
    kind: terrain
    visible: true
    locked: false
    opacity: 1.0
    z: 0
    source: terrain.bin
  - id: layer_borders
    name: 疆界
    kind: border
    visible: true
    locked: false
    opacity: 0.8
    z: 10
    source: borders.yaml
  - id: layer_roads
    name: 道路
    kind: road
    visible: true
    locked: false
    opacity: 0.9
    z: 20
    source: roads.yaml
