# 本地构建配置。
#
# 关闭增量编译的原因：本机 rustc 1.97.1 (8bab26f4f) 在 Windows + D 盘上
# 对 wv-app 触发 ICE（rustc_metadata::rmeta::encoder::encode_metadata
# 在写 incremental 目录时 panic，OS error 5 拒绝访问）。
# 非增量编译实测正常。待 rustc 版本升级后可重新评估移除本配置。
#
# 2026-10-24 追记：疑似根因 = Windows Defender 实时扫描锁 incremental 目录
# （OS error 5 拒绝访问符合文件被占用的表现）。已将 D:\kudi-projects 加入
# Defender 排除项后复测通过（见同日施工记录），恢复默认增量编译。
# 若 ICE 复发，恢复手段：在 [build] 段加回 `incremental = false`。

[build]
# 2026-10-27 用户裁定（feat/faction-partition-map 施工期）：**target 隔离到
# worktree 内 `.target/`**——共享全局 CARGO_TARGET_DIR 与并行 worktree 撞车
# （map-tree 分支的 wv-core rmeta 带本分支没有的字段，本分支测试读到幽灵
# E0063，反之亦然）。编译缓存仍由上行 sccache 兜底（跨目录复用），独立
# 目录的全量重编成本秒级。`.target/` 已在 .gitignore（§13 回退方案同款）。
target-dir = ".target"
# sccache rustc 包装器（2026-10-25 用户裁定恢复——d5ef2b9 曾移除）：
# worktree 独立 target 目录（AGENTS §13 回退方案）只免「产物串味」，
# 编译本身仍要重来；sccache 按「编译器 + 输入哈希」跨 target 目录复用
# 编译结果，独立目录的全量重编成本从分钟级降到秒级。走 PATH 解析，
# 不写死绝对路径（d:/sccache 那版的问题）。
rustc-wrapper = "sccache"
# incremental = false  # 2026-10-24 复测通过后停用，原因见上

# 渲染层检查别名（AGENTS §7.1，2026-10-13 用户裁定）：
# `#[cfg(feature = "app")]` 的渲染/UI 模块**不在** §7.1 的三条闸门命令的
# 编译范围内（`cargo test --workspace` 等对 wv-app 跑出 0 个测试目标），
# 必须单独用带 feature 的命令验证。别名只是省敲：
#   cargo app-test   == cargo test -p wv-app --features app --no-fail-fast
#   cargo app-clippy == cargo clippy -p wv-app --all-targets --features app -- -D warnings
#
# 同理（ADR-0014，2026-10-14）：HTTP/MCP 服务挂在 `#[cfg(feature = "http")]`
# 下，`cargo test --workspace` 不会编译；`cargo app-test` 也不会（http 隐式依赖
# app 之外的 axum/tokio/async-trait/serde_json）。用 `cargo http-test` 验证
# http 模块。
[alias]
app-test = "test -p wv-app --features app --no-fail-fast"
app-clippy = "clippy -p wv-app --all-targets --features app -- -D warnings"
http-test = "test -p wv-app --features http --no-fail-fast"
http-clippy = "clippy -p wv-app --all-targets --features http -- -D warnings"
