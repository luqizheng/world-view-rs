[package]
name = "wv-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "World View 应用层：Bevy 渲染、UI、输入，转发编辑命令到 wv-edit"

# 应用层默认只编译 CLI 部分，渲染/UI 需显式开启 `app` feature。
# 原因：Bevy 依赖树庞大，阶段一（数据层打底）不应对其产生构建依赖。
# `http` feature（ADR-0014）让 LLM 客户端（Claude Desktop 等）通过 MCP 协议
# 读 / 改 / 存当前打开的世界；依赖 `app`（GUI 主循环持有 WorldProjection + History），
# 仅在显式 `--features http` 时拉取。默认不编译，§7.1 渲染层命令同理。
[features]
default = []
app = ["wv-render/app", "dep:bevy", "dep:bevy_egui", "dep:egui_extras", "dep:rfd", "dep:icu_provider"]
http = ["app", "dep:axum", "dep:tokio", "dep:async-trait", "dep:base64"]
# bevy 动态链接（2026-10-29 用户提速提案，**严格 dev-only**）：
# `cargo build -p wv-app --features dev-dynamic` 把 bevy 编成 dylib，
# 最终 wv.exe 只链工作区代码——链接时间大幅下降（bevy 树占链接输入的大头）。
# feature 统一（Cargo 语义）让整个依赖图的 bevy 都走 dylib，无需四个
# bevy 消费 crate 各自透传。
#
# ⚠️ 三条使用纪律：
# 1. **切换 = 一次全量重编**（feature 集变化改变全部指纹，实测量级 ~50min，
#    同换 linker）。选定一种模式就固定用；别在 static/dynamic 间反复横跳。
# 2. **测试与发布保持静态**：门禁命令（app-test / app-clippy）不带本 feature，
#    `--release` 也不带——dynamic 只用于日常 `wv gui` 迭代。
# 3. 运行需 DLL 在 exe 旁（cargo 自动落位 `target/debug/bevy_dylib…`），
#    用 `cargo run` 启动即可；直接双击 exe 前先确认 DLL 就位。
dev-dynamic = ["app", "bevy/dynamic_linking"]

# dev-only：axum `Router::oneshot` 走 `tower::ServiceExt`，与 `body::to_bytes`、
# `Body::from` 配对做端到端 smoke（HTTP 测试模块 `server.rs`）。
[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
[dependencies]
wv-core = { workspace = true }
wv-terrain = { workspace = true }
wv-io = { workspace = true }
wv-edit = { workspace = true }
wv-render = { workspace = true }
wv-world-cell-map = { workspace = true }
# 默认地图风格层（ADR-0066）：UI 侧直接重导出风格数据，不再经 wv-render 中转。
wv-default-theme = { workspace = true }
# ADR-0026：界面控件层（egui 控件 + 界面令牌），**非 optional**——控件层
# 本体就是 egui，标准 `cargo test --workspace` 必须编译它（消灭 §7.1 盲区）。
# 不受 `app` feature 门控；`app` 门此后只管 panel / dialog 层。
wv-ui = { workspace = true }
wv-overture = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
bevy = { workspace = true, optional = true }
bevy_egui = { workspace = true, optional = true }
egui_extras = { workspace = true, optional = true }
rfd = { workspace = true, optional = true }
# ICU4X 在 debug 构建且未开 `logging` feature 时，把 log::warn 别名成 std::eprintln
# （icu_provider-2.3.1 src/lib.rs:192-203），导致字体断行告警以裸格式刷屏且无法用
# EnvFilter 过滤。开启该 feature（已在依赖树内，无新二进制）让告警走 `log` facade，
# 由 gui.rs 的 LogPlugin filter（icu_provider=off）静默。
icu_provider = { version = "2.3", optional = true, features = ["logging"] }
# http feature 依赖
axum = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
serde_json = { workspace = true }
# MCP image content 的 base64 编码（ADR-0078 screenshot 回传）。
base64 = { workspace = true, optional = true }

[[bin]]
name = "wv"
path = "src/main.rs"
required-features = ["app"]

# 独立数据工具：生成 work-view-test 演示底座（无 GUI、无 app feature、零网络）。
[[bin]]
name = "wv-gen-demo"
path = "src/bin/gen_demo/main.rs"

# 这些示例直接使用 app-only 渲染模块；无 feature 的 `--all-targets` 不应编译它们。
[[example]]
name = "render_map_modes"
required-features = ["app"]

[[example]]
name = "build_seattle_terrain"
required-features = ["app"]

[[example]]
name = "game_consumer"
required-features = ["app"]

[[example]]
name = "diag_sea_bake"
required-features = ["app"]
