# 瓦片图集映射（README §12-14 待决 14 的第一版直铺实现）
#
# 这是**渲染资产配置**（app 层资源），不是世界数据：世界数据的权威仍在工程 YAML。
# 换图集 = 换这里的映射，代码零改动。
#
# cols/rows  : 图集的网格规格（v2 为 2048×1536，8 列 × 6 行、每格 256px）。
# inset_px   : 采样时从每格四边内缩的像素（避开黑色网格分隔线与 JPEG 溢边）。
# tiles      : TerrainKind 编号 → [col, row]（0 起，左上原点）。缺项回退纯色平涂。
# v2（2026-10-12）：scripts/gen_tile_atlas.py 生成——环面无缝噪声 + 伪光照，
# 替换 v1 手工拼图（方案 D，边界质量配合 terrain_view 扰动合成）。v1 保留回滚。
atlas: tilesets/jrpg_atlas_v2.png
cols: 8
rows: 6
inset_px: 8
tiles:
  0: [0, 0] # 深水
  1: [3, 0] # 浅水
  2: [5, 0] # 沙滩
  3: [0, 2] # 草原
  4: [4, 1] # 林地（深色树冠俯视）
  5: [5, 2] # 丘陵（草甸起伏）
  6: [0, 3] # 山地（岩体雪峰）
  7: [6, 4] # 雪原（碎石雪地）
  8: [2, 4] # 沼泽（暗色湿地）
  9: [3, 5] # 道路（土路）
