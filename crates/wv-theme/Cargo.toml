[package]
name = "wv-theme"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "World View 主题层：色板、装饰旗标、覆盖物规则与主题包契约（ADR-0043）"

# 与 wv-render 相反，bevy 系依赖**非 optional**（同 wv-ui，ADR-0026 D2）：
# `PaletteColors` 的 36 槽就是 `bevy::color::Color`，本 crate 的本体是
# Bevy 类型；设门只会把「标准门禁不编译」的旧病带进新 crate。
#
# `wv-terrain` 是纯数据叶子（零 Bevy / 零网络），用于取群系族枚举
# `BiomeFamily`（ADR-0032 D2 规则键）——契约面要自包含，外部主题 crate
# 不必再摸 wv-terrain。
[dependencies]
bevy = { workspace = true }
wv-terrain = { workspace = true }
