[package]
name = "wv-theme-chinese-ink"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "示例主题包：水墨（chinese_ink）—— ADR-0023 M2 演示"

# ADR-0043 D2：主题 crate 只依赖 `wv-theme`，**不再依赖 `wv-render`**——
# 「加新风格 = 加新 crate、零改渲染层源码」得以成立的关键。
# 原先的 `app` feature 门随该依赖一起撤销（它只是为了门住 wv-render）。
[dependencies]
wv-theme = { workspace = true }
