[package]
name = "wv-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "World View 渲染层：Bevy 地图渲染、渲染配色与视图状态（ADR-0020）"

# 渲染层默认不编译（与 wv-app 的 `app` feature 同一红线，AGENTS §7.1）：
# Bevy 依赖树庞大，数据层与 CLI 不应对其产生构建依赖。
# `app` feature 打开后才有全部渲染模块；wv-app 的 `app` feature 会传递打开它。
[features]
default = []
# `wv-theme` 随 app 一起打开：它非 optional 依赖 bevy（ADR-0043 D1/D2），
# 而本 crate 的红线是「不带 feature 时零 Bevy 依赖树」（ADR-0020）。
app = ["dep:bevy", "dep:bevy_egui", "dep:wv-theme"]

[dependencies]
wv-core = { workspace = true }
wv-terrain = { workspace = true }
# tile_atlas 的图集配置（AtlasConfig）从随图 YAML 读——与 wv-io 同一纯数据依赖，
# 不引入任何渲染/网络库（ADR-0020 §2.1 落地注记：允许表 +serde/+serde_yaml）。
serde = { workspace = true }
serde_yaml = { workspace = true }
bevy = { workspace = true, optional = true }
# camera / drill / brush_cursor 需要读「指针是否悬在 UI 上」（bevy_egui 的 EguiContext）；
# 纯渲染路径不使用 egui 面板（那是 wv-app 的事）。
bevy_egui = { workspace = true, optional = true }
# 主题层（色板 / 装饰旗标 / 覆盖物规则 / 主题包契约）——ADR-0043 D2。
wv-theme = { workspace = true, optional = true }

[dev-dependencies]
# examples（ADR-0051 P1 demo / R1 spike）需要 Bevy；dev-dependency 不进
# 默认依赖树，`cargo test --workspace`（不带 feature）依旧零 Bevy 编译。
bevy = { workspace = true }
wv-terrain = { workspace = true }

# P1 demo（ADR-0051）：field 管线在 `app` feature 门下（依赖 bevy + wv-theme），
# example 必须声明 required-features 才能编译——不为 demo 打破默认零 Bevy 树。
# P1 demo（ADR-0053）：独立可运行程序，演示 GPU 逐像素地形场。
# 必须在 material.rs + terrain_field.wgsl 就位后才启用——声明指向不存在的
# 文件会让本 crate 全部 target 编译失败（连 lib 单测都跑不了）。
[[example]]
name = "terrain_field_demo"
path = "examples/terrain_field_demo.rs"
required-features = ["app"]

# R1 spike：核验 Bevy 0.19 的 `Material2d` + WGSL import 路径（全仓首个自定义
# 材质先例）。已实测通过——`AsBindGroup` 三类绑定 + `#import bevy_sprite::`
# 的 `mesh2d_vertex_output::VertexOutput` 入口均成立。
[[example]]
name = "r1_spike"
path = "examples/r1_spike.rs"
required-features = ["app"]
