[workspace]
resolver = "2"
members = [
    "crates/wv-core",
    "crates/wv-terrain",
    "crates/wv-io",
    "crates/wv-edit",
    "crates/wv-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/worldview-rs"
description = "以地理为底、时间轴为骨、人物与事件为魂的单机世界编辑器"

[workspace.dependencies]
# 数据层（纯 Rust，不依赖 Bevy）
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2"

# 内部 crate
wv-core = { path = "crates/wv-core" }
wv-terrain = { path = "crates/wv-terrain" }
wv-io = { path = "crates/wv-io" }
wv-edit = { path = "crates/wv-edit" }
wv-app = { path = "crates/wv-app" }

# IO 层二进制分块（基线 §2.18：已批准，仅 wv-io 使用）。
bincode = "1.3"
zstd = "0.13"

# 渲染与 UI。默认不编译，需显式开启 `--features app`：
# Bevy 体系体积大，阶段一/阶段二未开始前不应阻塞数据层开发。
# 注意：workspace.dependencies 不支持 optional，optional 在各成员 crate 上声明。
bevy = "0.15"
bevy_egui = "0.32"

# 原生文件对话框（仅 wv-app 用，`app` feature 才会拉）。
# 默认 backend 是 xdg-portal（Linux），跨平台开箱即用；
# Windows / macOS 直接走 OS API，无需额外依赖。
# AGENTS §9 审视通过：依赖面小、与 P1（单机可运行）不冲突、不污染数据层。
rfd = "0.17"

# [启动性能] debug 构建下对热点包开优化：地形纹理合成（wv-app）与图集 PNG
# 解码（image）在无优化 debug 下合计阻塞主线程 >5s，触发 Windows「未响应」
# （启动白屏）。只影响这两个包的编译产物，增量编译代价可接受。
[profile.dev.package.wv-app]
opt-level = 2

[profile.dev.package.image]
opt-level = 2
