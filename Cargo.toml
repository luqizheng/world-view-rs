[workspace]
resolver = "2"
members = [
    "crates/wv-core",
    "crates/wv-terrain",
    "crates/wv-io",
    "crates/wv-overture",
    "crates/wv-edit",
    "crates/wv-app",
    "crates/wv-render",
    "crates/wv-world-cell-map",
    "crates/wv-ui",
    "crates/wv-theme",
    "crates/wv-theme-chinese-ink",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/worldview-rs"
description = "以地理为底、时间轴为骨、人物与事件为魂的单机世界编辑器"

[workspace.dependencies]
# 数据层（纯 Rust，不依赖 Bevy）
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2"

# 内部 crate
wv-core = { path = "crates/wv-core" }
wv-terrain = { path = "crates/wv-terrain" }
wv-io = { path = "crates/wv-io" }
wv-overture = { path = "crates/wv-overture" }
wv-edit = { path = "crates/wv-edit" }
wv-render = { path = "crates/wv-render" }
wv-world-cell-map = { path = "crates/wv-world-cell-map" }
wv-ui = { path = "crates/wv-ui" }
wv-theme = { path = "crates/wv-theme" }
wv-theme-chinese-ink = { path = "crates/wv-theme-chinese-ink" }
wv-app = { path = "crates/wv-app" }

# IO 层二进制分块（基线 §2.18：已批准，仅 wv-io 使用）。
bincode = "1.3"
zstd = "0.13"

# 渲染与 UI。默认不编译，需显式开启 `--features app`：
# Bevy 体系体积大，阶段一/阶段二未开始前不应阻塞数据层开发。
# 注意：workspace.dependencies 不支持 optional，optional 在各成员 crate 上声明。
# 2026-10-13：0.15.3 -> 0.19，理由与代价见 docs/adr/ADR-0011。
bevy = "0.19"
bevy_egui = "0.42"

# egui 图像解码器（SVG → 像素）。仅 wv-app 用，`app` feature 才会拉。
# egui core 的 loader 链只有「取字节（DefaultBytesLoader）」和「颜色→纹理
# （DefaultTextureLoader）」两级，`ImageLoader`（字节解码）默认为空——
# 2026-10-15 实测：工具栏 SVG 全部渲染成红三角占位（egui 的加载失败图）。
# 解码器只在官方配套 egui_extras 里（svg feature 走 resvg）。
# AGENTS §9 审视：分层零风险（仅 wv-app 渲染层）；标准库无等价物，自己包
# resvg 反而多一层胶水；不进任何序列化路径，YAML round-trip 无关。
# 版本必须与 bevy_egui 内嵌的 egui（0.36）严格同轨，避免双 egui 实例。
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }

# 原生文件对话框（仅 wv-app 用，`app` feature 才会拉）。
# 默认 backend 是 xdg-portal（Linux），跨平台开箱即用；
# Windows / macOS 直接走 OS API，无需额外依赖。
# AGENTS §9 审视通过：依赖面小、与 P1（单机可运行）不冲突、不污染数据层。
rfd = "0.17"

# LLM 可控编辑（ADR-0014）。仅 `wv-app --features http` 时拉取。
# 默认不编译，与 §7.1 渲染层独立命令同理——
# 普通 `cargo test --workspace` / `cargo clippy --workspace` 不应编译 HTTP 模块，
# 避免误以为 http 路径已被默认闸门覆盖。
# axum：MCP 2025-03-26 Streamable HTTP 协议的服务端框架。
# `json` feature 启用 `axum::Json`（POST /mcp body 反序列化用）。
# `macros` feature 启用路由宏（v0.1 暂用 `Router::new().route` 拼接）。
# tokio：异步运行时（axum 的默认运行时；与 Bevy 主线程并行）。
#   `rt-multi-thread` 提供多线程运行时；`net` 提供 TcpListener；
#   `macros` 提供 #[tokio::main]（handler 单元测试用）。
#   与 Bevy 不抢主线程：HTTP handler 在 tokio runtime 中跑，
#   写命令经 tokio::sync::mpsc 投递到 Bevy 主帧 drain（AGENTS §3.3）。
# async-trait：trait 中放 async fn 的语法糖（skill handler 是 async）。
# serde_json：MCP payload 是 JSON，与 serde_yaml 平级，二选一（HTTP 选 JSON）。
axum = { version = "0.8", features = ["json", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync"] }
async-trait = "0.1"
serde_json = "1"

# ── 构建档位（2026-10-23，迭代档缺陷修复 B 项）─────────────────────────────
#
# ## 为什么动这里
# 用户报「cell-map 里 zoom in/out 只有个位数 FPS」。此前只有两条包级例外，
# **没有** `[profile.dev]`——也就是说 bevy / wgpu / egui 与 wv-render /
# wv-world-cell-map / wv-terrain **全部跑在 opt-level 0**。实测（探针见
# `crates/wv-world-cell-map/src/terrain_view/perf_probe.rs`，数字表见
# `docs/PERF_GRID_AND_PROFILE_v0.1.md`）：
#
# | 热点 | debug（opt 0） | release | 倍数 |
# |---|---|---|---|
# | grid_chains + build_stroke_mesh（1024²） | 0.74ms | 0.15ms | 4.9× |
# | assemble_strokes（DP 全链，1024²） | 15.56ms | 3.92ms | 4.0× |
# | terrain_pixels（1024² 整图合成） | 581.24ms | 16.64ms | 34.9× |
#
# 一帧 16.7ms 的预算下，DP 一项就能吃掉 15.6ms；整图合成 581ms 则是「换模式 /
# 换主题」时的整秒卡顿来源。故按「谁热谁优化」分三档，而不是一刀切：
#
# ## 三档分工
# - `[profile.dev]` = 1：**本工作区成员**的默认档。成员代码主要是搭线、状态机、
#   UI 贴合，opt-level 1 拿到大部分收益而增量编译代价最小（实测整工程首次
#   编译 1m40s → 见施工报告；增量 ~10–20s）。
# - `[profile.dev.package."*"]` = 2：**第三方依赖**（bevy / wgpu / egui / image…）。
#   通配只覆盖依赖，不覆盖工作区成员（Cargo 的 `*` 语义），所以两条互不冲突。
#   依赖很少改动，一次编译长期受益，给到 2 是「启动/首帧」性价比最高的一档。
# - 三个**像素 / 几何 / DP 热点 crate** = 3：`wv-world-cell-map`（整图合成 +
#   网格 + 等值线几何）、`wv-terrain`（marching squares / DP 纯算法）、
#   `wv-render`（桥接层里逐帧消费的那些循环）。给到 3 而非 2 的理由：这三个
#   crate 的代码几乎全是紧循环（逐 cell / 逐段 / 逐像素），opt 3 的向量化
#   收益显著，且它们体量小，编辑后重编 5–15s，作者等得起。
#
# ## 为什么删掉 `image = 2`
# `[profile.dev.package."*"]` 已经把 `image` 定到 2——留着就是「同一事实两个
# 载体」（改通配忘了改单条 → 两条互相打架时以单条为准，排查时先怀疑错地方）。
#
# ## 为什么保留 `wv-app = 2`
# 它**不**被通配覆盖（工作区成员），而 `[profile.dev]` 只给到 1。启动期卡顿
# 的原始诊断（2026-10 前：地形纹理合成 + 图集 PNG 解码合计 >5s，Windows
# 「未响应」白屏）里，PNG 解码现在归 `image`（通配 2）、纹理合成已迁去
# `wv-world-cell-map`（3），但 wv-app 仍是**启动链的主干**（装配 / 加载 /
# 首帧 UI），保留 2 是廉价的保险。若日后实测启动不再敏感，可降回 1。
# ## 为什么 dev 档位把 debuginfo 降到 `line-tables-only`（2026-10-23 追加）
# opt-level 提上去以后，`target/debug` 从 ~40G 涨到 **77G**，本机 D: 盘被撑满，
# 构建直接死于 `rustc-LLVM ERROR: IO failure on output stream: no space on device`。
# `line-tables-only` 保留「文件:行号」级回溯（panic / RUST_BACKTRACE 仍可读），
# 砍掉变量级 DWARF——那是体积与链接时间的大头，而作者调编辑器基本不用 debugger
# 看 bevy 内部变量。要逐变量调试某个依赖时，临时给那**一个**包开 `debug = 2`。
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.wv-world-cell-map]
opt-level = 3

[profile.dev.package.wv-terrain]
opt-level = 3

[profile.dev.package.wv-render]
opt-level = 3

[profile.dev.package.wv-app]
opt-level = 2
